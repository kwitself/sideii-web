name: SIDEII Build Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: sideii_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sideii_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise real PostgreSQL row-lock concurrency (isolated fixtures)
        env:
          DATABASE_URL: postgresql://postgres:testonly@127.0.0.1:5432/sideii_qa
        run: bash tests/postgres-concurrency-smoke.sh
      - name: Verify refund-compatible payment event index constraints
        env:
          DATABASE_URL: postgresql://postgres:testonly@127.0.0.1:5432/sideii_qa
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/payment-index-postgres.sql
      - name: Verify notification lease ownership and expiration
        env:
          DATABASE_URL: postgresql://postgres:testonly@127.0.0.1:5432/sideii_qa
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/notification-lease-postgres.sql
      - name: Verify page-builder RLS, draft isolation, publication and revision conflicts
        env:
          DATABASE_URL: postgresql://postgres:testonly@127.0.0.1:5432/sideii_qa
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/page-builder-postgres.sql
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Payment security regression tests
        run: node --test tests/*.test.mjs
      - name: Build Next.js
        run: npm run build
