name: SIDE II Next.js CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Check QA test syntax
        id: syntax
        run: |
          node --check scripts/check-cart-smoke.mjs
          node --check scripts/check-finance-invariants.mjs
          node --check scripts/check-checkout-guards.mjs
          node --check scripts/check-order-notification-guards.mjs
          node --check scripts/check-payment-stock-guards.mjs
          node --check scripts/check-launch-seo-guards.mjs
          node --check scripts/check-http-smoke.mjs
      - name: Run all SIDE II safety checks
        id: qa
        run: npm run qa
      - name: Build Next.js
        id: build
        run: npm run build
      - name: Read-only HTTP smoke against built app
        id: http
        run: |
          npm run start > /tmp/sideii-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3000/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 100 /tmp/sideii-next.log
            exit 1
          fi
          npm run qa:http || { tail -n 120 /tmp/sideii-next.log; exit 1; }
      - name: Upload failed build runtime logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sideii-next-runtime-logs
          path: /tmp/sideii-next.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Record QA outcome
        if: always()
        env:
          INSTALL_STATUS: ${{ steps.install.outcome }}
          SYNTAX_STATUS: ${{ steps.syntax.outcome }}
          QA_STATUS: ${{ steps.qa.outcome }}
          BUILD_STATUS: ${{ steps.build.outcome }}
          HTTP_STATUS: ${{ steps.http.outcome }}
        run: |
          {
            echo '## SIDE:II release QA'
            echo ''
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| npm ci | $INSTALL_STATUS |"
            echo "| Node syntax | $SYNTAX_STATUS |"
            echo "| npm run qa | $QA_STATUS |"
            echo "| Next.js production build | $BUILD_STATUS |"
            echo "| Built application HTTP smoke | $HTTP_STATUS |"
            echo ''
            echo 'A skipped or failed step does not establish launch readiness.'
            echo ''
            echo 'Browser/mobile acceptance and payment-provider sandbox tests remain manual release gates.'
          } >> "$GITHUB_STEP_SUMMARY"
